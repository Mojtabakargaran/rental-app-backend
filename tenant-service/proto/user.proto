syntax = "proto3";

package user;

service UserService {
  rpc GetOwnerByTenant (GetOwnerByTenantRequest) returns (GetOwnerByTenantResponse);
}

message GetOwnerByTenantRequest {
  string tenantId = 1;
  string correlationId = 2;
}

message UserRole {
  string code = 1;
  string name = 2;
}

message UserProfile {
  string id = 1;
  string tenantId = 2;
  string fullName = 3;
  string email = 4;
  string phoneNumber = 5;
  string languagePreference = 6;
  bool isActive = 7;
  UserRole role = 8;
}

message GetOwnerByTenantResponse {
  bool success = 1;
  UserProfile user = 2;
  string error = 3;
  string code = 4;
}
