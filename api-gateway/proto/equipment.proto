syntax = "proto3";

package equipment;

// List Categories Request
message ListCategoriesRequest {
  string tenantId = 1;
  bool activeOnly = 2;
  string correlationId = 3;
}

// List Categories Response
message ListCategoriesResponse {
  bool success = 1;
  repeated Category categories = 2;
  string error = 3;
  string code = 4;
}

// View Categories Request (P5UC02)
message ViewCategoriesRequest {
  string tenantId = 1;
  int32 page = 2;
  int32 pageSize = 3;
  string search = 4;
  string status = 5;
  string hierarchyLevel = 6;
  string correlationId = 7;
}

// View Categories Response (P5UC02)
message ViewCategoriesResponse {
  bool success = 1;
  repeated CategoryDetail categories = 2;
  Pagination pagination = 3;
  string error = 4;
  string code = 5;
}

// Category Detail (for view with additional fields)
message CategoryDetail {
  string id = 1;
  string name = 2;
  string description = 3;
  string parentId = 4;
  string parentName = 5;
  int32 level = 6;
  bool isActive = 7;
  string createdAt = 8;
  int32 childrenCount = 9;
}

// Pagination
message Pagination {
  int32 currentPage = 1;
  int32 pageSize = 2;
  int32 totalItems = 3;
  int32 totalPages = 4;
  bool hasNextPage = 5;
  bool hasPreviousPage = 6;
}

// Create Category Request
message CreateCategoryRequest {
  string name = 1;
  string description = 2;
  string parentId = 3;
  bool isActive = 4;
  string tenantId = 5;
  string createdBy = 6;
  string ipAddress = 7;
  string userAgent = 8;
  string correlationId = 9;
}

// Create Category Response
message CreateCategoryResponse {
  bool success = 1;
  Category category = 2;
  string error = 3;
  string code = 4;
}

// Update Category Request (P5UC03)
message UpdateCategoryRequest {
  string categoryId = 1;
  string tenantId = 2;
  string userId = 3;
  string name = 4;
  string description = 5;
  string parentId = 6;
  bool isActive = 7;
  string correlationId = 8;
  repeated string clearedFields = 9;
}

// Update Category Response (P5UC03)
message UpdateCategoryResponse {
  bool success = 1;
  CategoryDetail category = 2;
  string error = 3;
  string code = 4;
}

// Category Message
message Category {
  string id = 1;
  string name = 2;
  string description = 3;
  string parentId = 4;
  int32 level = 5;
  bool isActive = 6;
}

// Deactivate Category Request (P5UC04)
message DeactivateCategoryRequest {
  string categoryId = 1;
  string tenantId = 2;
  string userId = 3;
  string reason = 4;
  string correlationId = 5;
}

// Deactivate Category Response (P5UC04)
message DeactivateCategoryResponse {
  bool success = 1;
  CategoryStatus category = 2;
  string error = 3;
  string code = 4;
}

// Reactivate Category Request (P5UC04)
message ReactivateCategoryRequest {
  string categoryId = 1;
  string tenantId = 2;
  string userId = 3;
  string correlationId = 4;
}

// Reactivate Category Response (P5UC04)
message ReactivateCategoryResponse {
  bool success = 1;
  CategoryStatus category = 2;
  string error = 3;
  string code = 4;
}

// Delete Category Request (P5UC04)
message DeleteCategoryRequest {
  string categoryId = 1;
  string tenantId = 2;
  string userId = 3;
  string correlationId = 4;
}

// Delete Category Response (P5UC04)
message DeleteCategoryResponse {
  bool success = 1;
  CategoryDeleted category = 2;
  string error = 3;
  string code = 4;
  repeated string childCategories = 5;
  int32 equipmentCount = 6;
}

// Category Status (for deactivate/reactivate responses)
message CategoryStatus {
  string id = 1;
  string name = 2;
  bool isActive = 3;
  string deactivatedAt = 4;
  string reactivatedAt = 5;
}

// Category Deleted (for delete response)
message CategoryDeleted {
  string id = 1;
  string name = 2;
  string deletedAt = 3;
}

// Custom Attribute
message CustomAttribute {
  string key = 1;
  string value = 2;
  string unit = 3;
}

// Create Equipment Request
message CreateEquipmentRequest {
  string tenantId = 1;
  string userId = 2;
  string name = 3;
  string categoryId = 4;
  string description = 5;
  string manufacturer = 6;
  string model = 7;
  string serialNumber = 8;
  int32 yearOfManufacture = 9;
  double purchasePrice = 10;
  string purchaseDate = 11;
  string status = 12;
  repeated CustomAttribute customAttributes = 13;
  string correlationId = 14;
}

// Equipment Item
message EquipmentItem {
  string id = 1;
  string tenantId = 2;
  string name = 3;
  string categoryId = 4;
  string categoryName = 5;
  string description = 6;
  string manufacturer = 7;
  string model = 8;
  string serialNumber = 9;
  int32 yearOfManufacture = 10;
  double purchasePrice = 11;
  string purchaseDate = 12;
  string status = 13;
  repeated CustomAttribute customAttributes = 14;
  string createdBy = 15;
  string createdAt = 16;
  string updatedAt = 17;
}

// Create Equipment Response
message CreateEquipmentResponse {
  bool success = 1;
  EquipmentItem equipment = 2;
  string error = 3;
  string code = 4;
}

// List Equipment
message EquipmentFilters {
  repeated string status = 1;
  repeated string categoryId = 2;
  string manufacturer = 3;
  string searchQuery = 4;
  string purchaseDateFrom = 5;
  string purchaseDateTo = 6;
  string createdDateFrom = 7;
  string createdDateTo = 8;
}

message ListEquipmentRequest {
  string tenantId = 1;
  string userId = 2;
  int32 page = 3;
  int32 limit = 4;
  string sortBy = 5;
  string sortOrder = 6;
  EquipmentFilters filters = 7;
}

message ListEquipmentItem {
  string id = 1;
  string name = 2;
  string categoryId = 3;
  string categoryPath = 4;
  string serialNumber = 5;
  string status = 6;
  string manufacturer = 7;
  string model = 8;
  int32 yearOfManufacture = 9;
  double purchasePrice = 10;
  string purchaseDate = 11;
  string description = 12;
  repeated CustomAttribute customAttributes = 13;
  string createdAt = 14;
  string updatedAt = 15;
}

message ListEquipmentData {
  repeated ListEquipmentItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
  int32 totalPages = 5;
  bool hasNextPage = 6;
  bool hasPreviousPage = 7;
}

message ListEquipmentResponse {
  bool success = 1;
  ListEquipmentData data = 2;
  string error = 3;
  string code = 4;
}

// Get Equipment Details
message GetEquipmentDetailsRequest {
  string equipmentId = 1;
  string tenantId = 2;
  string userId = 3;
  string correlationId = 4;
}

message EquipmentDetailsItem {
  string id = 1;
  string tenantId = 2;
  string name = 3;
  string categoryId = 4;
  string categoryName = 5;
  string categoryPath = 6;
  string description = 7;
  string manufacturer = 8;
  string model = 9;
  string serialNumber = 10;
  int32 yearOfManufacture = 11;
  double purchasePrice = 12;
  string purchaseDate = 13;
  string status = 14;
  repeated CustomAttribute customAttributes = 15;
  string createdBy = 16;
  string updatedBy = 17;
  string createdAt = 18;
  string updatedAt = 19;
  string deletedAt = 20;
}

message GetEquipmentDetailsResponse {
  bool success = 1;
  EquipmentDetailsItem equipment = 2;
  string error = 3;
  string code = 4;
}

// Update Equipment
message UpdateEquipmentRequest {
  string equipmentId = 1;
  string tenantId = 2;
  string userId = 3;
  string correlationId = 4;
  string name = 5;
  string categoryId = 6;
  string description = 7;
  string manufacturer = 8;
  string model = 9;
  string serialNumber = 10;
  int32 yearOfManufacture = 11;
  double purchasePrice = 12;
  string purchaseDate = 13;
  string status = 14;
  repeated CustomAttribute customAttributes = 15;
  repeated string clearedFields = 16;
}

message UpdateEquipmentResponse {
  bool success = 1;
  EquipmentDetailsItem equipment = 2;
  string error = 3;
  string code = 4;
}

// Update Equipment Status
message UpdateEquipmentStatusRequest {
  string equipmentId = 1;
  string tenantId = 2;
  string userId = 3;
  string correlationId = 4;
  string status = 5;
  string reason = 6;
}

message EquipmentStatusItem {
  string id = 1;
  string name = 2;
  string status = 3;
  string updatedBy = 4;
  string updatedAt = 5;
}

message UpdateEquipmentStatusResponse {
  bool success = 1;
  message StatusUpdateData {
    EquipmentStatusItem equipment = 1;
    bool statusChanged = 2;
    string oldStatus = 3;
  }
  StatusUpdateData data = 2;
  string error = 3;
  string code = 4;
}

// Archive Equipment
message ArchiveEquipmentRequest {
  string equipmentId = 1;
  string tenantId = 2;
  string userId = 3;
  string correlationId = 4;
  string reason = 5;
}

message ArchivedEquipmentItem {
  string id = 1;
  string name = 2;
  string categoryId = 3;
  string categoryPath = 4;
  string status = 5;
  string deletedAt = 6;
  string deletedBy = 7;
}

message EquipmentFullData {
  string description = 1;
  string manufacturer = 2;
  string model = 3;
  string serialNumber = 4;
  int32 yearOfManufacture = 5;
  double purchasePrice = 6;
  string purchaseDate = 7;
  repeated CustomAttribute customAttributes = 8;
  string createdBy = 9;
  string createdAt = 10;
  string updatedBy = 11;
  string updatedAt = 12;
}

message ArchiveEquipmentResponse {
  bool success = 1;
  message ArchiveData {
    ArchivedEquipmentItem equipment = 1;
    EquipmentFullData fullData = 2;
  }
  ArchiveData data = 2;
  string error = 3;
  string code = 4;
}

// Delete Equipment Permanently
message DeleteEquipmentPermanentlyRequest {
  string equipmentId = 1;
  string tenantId = 2;
  string userId = 3;
  string correlationId = 4;
}

message DeletedEquipmentItem {
  string id = 1;
  string name = 2;
  string categoryPath = 3;
  string status = 4;
}

message EquipmentCompleteData {
  string categoryId = 1;
  string description = 2;
  string manufacturer = 3;
  string model = 4;
  string serialNumber = 5;
  int32 yearOfManufacture = 6;
  double purchasePrice = 7;
  string purchaseDate = 8;
  repeated CustomAttribute customAttributes = 9;
  string createdBy = 10;
  string createdAt = 11;
  string updatedBy = 12;
  string updatedAt = 13;
  string deletedAt = 14;
  string deletedBy = 15;
}

message DeleteEquipmentPermanentlyResponse {
  bool success = 1;
  message DeleteData {
    DeletedEquipmentItem deletedEquipment = 1;
    EquipmentCompleteData fullData = 2;
  }
  DeleteData data = 2;
  string error = 3;
  string code = 4;
}

// Equipment Service
service EquipmentService {
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc ViewCategories(ViewCategoriesRequest) returns (ViewCategoriesResponse);
  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse);
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse);
  rpc DeactivateCategory(DeactivateCategoryRequest) returns (DeactivateCategoryResponse);
  rpc ReactivateCategory(ReactivateCategoryRequest) returns (ReactivateCategoryResponse);
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse);
  rpc CreateEquipment(CreateEquipmentRequest) returns (CreateEquipmentResponse);
  rpc ListEquipment(ListEquipmentRequest) returns (ListEquipmentResponse);
  rpc GetEquipmentDetails(GetEquipmentDetailsRequest) returns (GetEquipmentDetailsResponse);
  rpc UpdateEquipment(UpdateEquipmentRequest) returns (UpdateEquipmentResponse);
  rpc UpdateEquipmentStatus(UpdateEquipmentStatusRequest) returns (UpdateEquipmentStatusResponse);
  rpc ArchiveEquipment(ArchiveEquipmentRequest) returns (ArchiveEquipmentResponse);
  rpc DeleteEquipmentPermanently(DeleteEquipmentPermanentlyRequest) returns (DeleteEquipmentPermanentlyResponse);
}
